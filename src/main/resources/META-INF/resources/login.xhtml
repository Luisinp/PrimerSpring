<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Iniciar sesión - TravelZen</title>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <h:outputStylesheet library="assets" name="css/primeflex.css"/>
    <h:outputStylesheet library="assets" name="css/primeicons.css"/>
    <h:outputStylesheet library="assets" name="css/stylle.css"/>
    <style>
        /* Fondo en degradado. Para usar una foto, ver la nota al final de este bloque. */
        body.login-fondo {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background-image: linear-gradient(135deg, #0b3c5d 0%, #1d7874 55%, #6fc3b0 100%) !important;
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        /* Tarjeta transparente (efecto vidrio esmerilado) */
        .login-caja {
            width: 100%; max-width: 400px; margin: 24px; padding: 32px 30px; color: #fff;
            background: rgba(255, 255, 255, .14);
            border: 1px solid rgba(255, 255, 255, .38); border-radius: 20px;
            -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, .28);
        }
        .login-titulo { font-size: 1.9rem; font-weight: 800; text-align: center; }
        .login-titulo i { color: #ffb25c; }
        .login-sub { text-align: center; opacity: .92; margin: 6px 0 22px; }
        .login-caja label { display: block; margin-bottom: 6px; font-weight: 600; font-size: .92rem; }
        .login-caja .ui-inputfield { background: rgba(255, 255, 255, .92); }
        .login-caja a { color: #ffd9a8; font-weight: 600; }
        .login-caja p { text-align: center; margin: 14px 0 0; font-size: .92rem; }
        .login-error { background: rgba(176, 0, 32, .85); color: #fff; padding: 10px 14px;
                       border-radius: 10px; margin-bottom: 16px; font-size: .9rem; }
        /* NOTA: para usar una foto, guarda assets/img/fondo-login.jpg y cambia la línea
           background-image por:
           background-image: url('assets/img/fondo-login.jpg'), linear-gradient(...) !important;
           (solo después de que el archivo exista). */
    </style>
</h:head>

<h:body styleClass="login-fondo">
    <div class="login-caja">

        <div class="login-titulo"><i class="pi pi-send"></i> TravelZen</div>
        <div class="login-sub">Inicia sesión para continuar</div>

        <h:panelGroup layout="block" styleClass="login-error" rendered="#{param.error != null}">
            Correo o contraseña incorrectos, o la cuenta está desactivada.
        </h:panelGroup>

        <!--importante siempre tener este parametro prependid en false-->
        <h:form prependId="false">
            <label for="username">Correo electrónico</label>
            <p:inputText id="username" styleClass="w-full mb-3" placeholder="correo@ejemplo.com"/>
            <label for="password">Contraseña</label>
            <p:password id="password" styleClass="w-full mb-3" placeholder="Tu contraseña"/>

            <p:commandButton id="submit" value="Iniciar sesión" ajax="false"
                             icon="pi pi-user" styleClass="w-full"/>
        </h:form>

        <p>¿No tienes cuenta? <a href="registro.xhtml">Regístrate aquí</a></p>
        <p><a href="home.xhtml">← Volver al catálogo</a></p>
    </div>
</h:body>
</html>
